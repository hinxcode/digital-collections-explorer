version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # Frontend - Photographs
  - package-ecosystem: "npm"
    directory: "/src/frontend/photographs"
    schedule:
      interval: "monthly"
    groups:
      build:
        patterns: ["vite", "@vitejs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "photographs"

  # Frontend - Maps
  - package-ecosystem: "npm"
    directory: "/src/frontend/maps"
    schedule:
      interval: "monthly"
    groups:
      build:
        patterns: ["vite", "@vitejs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "maps"

  # Frontend - Documents
  - package-ecosystem: "npm"
    directory: "/src/frontend/documents"
    schedule:
      interval: "monthly"
    groups:
      build:
        patterns: ["vite", "@vitejs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "documents"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
